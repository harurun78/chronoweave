version: '0.2'
global:
  tick_ms: 1
  stack_presets:
    low: 512
    mid: 2048
    high: 4096
  ram_capacity: 65536
tasks:
  - id: isr-timer
    name: ISR_Timer
    period_ms: 1
    wcet_ms: 0.05
    stack: low
  - id: motorctrl-x
    name: MotorCtrl_X
    period_ms: 10
    wcet_ms: 3
    stack: mid
  - id: sensor-fusion
    name: SensorFusion
    period_ms: 20
    wcet_ms: 6
    stack: mid
aperiodic_tasks:
  - id: diagnostics-request
    name: DiagnosticsRequest
    wcet_ms: 1.5
    deadline_ms: 50
    stack: low
sporadic_server:
  enabled: true
  budget_ms: 2
  period_ms: 20
  priority_mode: manual
  manual_priority: 3
  stack: mid
codegen:
  plugin: freertos
  namespace: MotorDemo